name: GitHub Metrics

on:
  # Daily update at 00:00 UTC
  schedule:
    - cron: "0 0 * * *"
  # Allows manual execution anytime via GitHub Actions tab
  workflow_dispatch:
  # Trigger on push to main branch
  push:
    branches:
      - main

jobs:
  isocalendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Isometric Commit Calendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.plugin.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: mohd-junaid-05
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Kolkata
          extras_css: |
            svg {
              background-color: #0b0b0b;
              border: 1px solid #2a2a2a;
              border-radius: 6px;
            }
            h2, h3 { color: #eeeeee !important; }
            .field { color: #aaaaaa !important; }
            .field svg { fill: #aaaaaa !important; }

  languages:
    needs: isocalendar
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Languages Activity
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.plugin.languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: mohd-junaid-05
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          commits_authoring: junaid03mo22@gmail.com, MohdJunaid, mohd-junaid-05
          config_timezone: Asia/Kolkata
          extras_css: |
            svg {
              background-color: #0b0b0b;
              border: 1px solid #2a2a2a;
              border-radius: 6px;
            }
            h2, h3 { color: #eeeeee !important; }
            .field { color: #aaaaaa !important; }
            .field svg { fill: #aaaaaa !important; }
